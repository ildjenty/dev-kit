[roles]
read_only_tools = ["Read", "Glob", "Grep"]

[roles.worker]
kind = "work"
agent = "devkit-worker"

[roles.judge]
kind = "judge"
agent = "devkit-judge"

[roles.planner]
kind = "plan"
agent = "devkit-planner"

[roles.human]
kind = "human"

[planning]
role = "planner"

[plan_check]
runner = "judge"
schemas = ["plan", "plan-template"]
