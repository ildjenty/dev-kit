# Human confirmation and lesson destination defaults belong to internal/config.

# PASS does not finalize completion until the plan's completion conditions are met.
# Limits, progress, return stages for broken premises, and termination kinds are also inputs.
[check_results]
"FAIL" = "fix"
"NOT ASSESSED" = "ask"
"PASS" = "done"

# Roles do not select runners. Assign runners in the template's checks.
[roles]
worker = "Worker"
human = "Human"
judge = "Judge"
planner = "Planner"
