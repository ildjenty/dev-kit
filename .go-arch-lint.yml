# Module dependency rules. Source of truth: the dependency diagram in docs/architecture/modules.md.
version: 3
workdir: .
excludeFiles:
  - "_test\\.go$"
allow:
  depOnAnyVendor: true
components:
  cmd: { in: cmd/devkit }
  assets: { in: assets }
  brief: { in: internal/brief }
  check: { in: internal/check }
  config: { in: internal/config }
  engine: { in: internal/engine }
  external: { in: internal/external }
  form: { in: internal/form }
  hook: { in: internal/hook }
  hostevent: { in: internal/host/event }
  install: { in: internal/install }
  kit: { in: internal/kit }
  ledger: { in: internal/ledger }
  fsstore: { in: internal/ledger/fsstore }
  plan: { in: internal/plan }
  router: { in: internal/router }
  source: { in: internal/source }
  view: { in: internal/view }
  workspace: { in: internal/workspace }
deps:
  cmd:
    anyProjectDeps: true
  install:
    mayDependOn: [config, kit, ledger, fsstore, workspace]
  engine:
    mayDependOn: [plan, brief, check, router, ledger, form, workspace, external, fsstore, config, hook, kit, source]
  external:
    mayDependOn: [config, form, ledger, fsstore, plan]
  hook:
    mayDependOn: [ledger, config, hostevent, form, fsstore]
  view:
    mayDependOn: [ledger, form, plan]
  ledger:
    mayDependOn: [plan, check, router, form, fsstore]
  brief:
    mayDependOn: [plan, form]
  check:
    mayDependOn: [form]
  router:
    mayDependOn: [plan, check, form]
  kit:
    mayDependOn: [assets]
