---
name: sync
description: Fetch and rebase onto the configured base branch. Resolve conflicts for
  at most five rounds, abort and restore when both changes cannot hold or conflicts
  remain, then run configured checks. Return needs_judge after conflict resolution.
  Do not push.
worktree:
  enabled: true
inputs:
  answers:
    default: ''
    description: The owner's answers to earlier questions, a JSON array of {question_id,
      answer} with the owner's words as they are, or empty.
  continue:
    default: ''
    description: The owner's words, as written, that let the branch start past the
      limit of restarts (devkit record limit), or empty. Only a start that reaches the
      limit takes them; any other start stops when they are passed.
returns: result
nodes:
- id: start
  bash: devkit record start sync
  output_format: &1
    type: object
    properties:
      stopped:
        type: boolean
      stage:
        type: string
      reason:
        type: string
      details:
        type: string
      remaining:
        type: array
        items:
          type: string
      start:
        type: string
      counted:
        type: boolean
      restarts:
        type: integer
    required:
    - stopped
    - stage
    - reason
    - details
    - remaining
    - start
    - counted
    - restarts
- id: not-started
  depends_on:
  - start
  when: "$start.output.stopped == true"
  bash: |
    value=$start.output
    printf '%s' "$value"
  output_format: *1
- id: rebase
  depends_on:
  - start
  when: "$start.output.stopped == false"
  bash: devkit sync start
  timeout: 600000
  output_format: &2
    type: object
    properties:
      state:
        type: string
        enum:
        - current
        - done
        - conflict
        - refused
        - contradiction
        - unresolved
      previous:
        type: string
      onto: {}
      ref: {}
      rounds:
        type: integer
      contradiction:
        type: string
      files:
        type: array
        items:
          type: string
      commit:
        type: string
    required:
    - state
    - previous
    - rounds
    - files
    - commit
- id: conflicts
  depends_on:
  - rebase
  when: "$rebase.output.state == 'conflict'"
  loop_group:
    max_iterations: 5
    on_exhausted: complete
    nodes:
    - id: resolve
      provider: claude
      command: resolve
      allowed_tools:
      - Read
      - Edit
      - Write
      - Grep
      - Glob
      - Bash
      output_format:
        type: object
        additionalProperties: false
        properties:
          resolved:
            type: boolean
          contradiction:
            type: string
        required:
        - resolved
        - contradiction
      context: fresh
    - id: continue
      depends_on:
      - resolve
      bash: |
        resolved=$resolve.output
        INPUTS_RESOLVED="$resolved" devkit sync continue
      output_format: *2
    until_bash: s=$continue.output.state; test "$s" != conflict
- id: rebased
  depends_on:
  - start
  - rebase
  - conflicts
  trigger_rule: all_done
  bash: devkit sync state
  output_format: *2
  when: "$start.output.stopped == false"
- id: checks
  depends_on:
  - rebased
  when: "$rebased.output.state == 'done' || $rebased.output.state == 'current'"
  bash: devkit checks
  output_format:
    type: object
    properties:
      round:
        type: integer
      passed: &3
        type: boolean
      stuck: *3
      failing: &4
        type: array
        items: &5
          type: string
      stuck_checks: *4
      skipped: *4
      results: *5
    required:
    - round
    - passed
    - stuck
    - failing
    - stuck_checks
    - skipped
    - results
  timeout: 7200000
- id: finish
  depends_on:
  - rebased
  - checks
  trigger_rule: none_failed_min_one_success
  bash: |
    gate=$checks.output
    INPUTS_GATE="$gate" devkit sync finish
  output_format:
    type: object
    properties:
      outcome:
        type: string
        enum:
        - pass
        - stop
      needs_judge:
        type: boolean
      conflict_rounds:
        type: integer
      onto:
        type: string
      previous:
        type: string
      commit:
        type: string
      failing:
        type: array
        items:
          type: string
      stop: {}
    required:
    - outcome
    - needs_judge
    - conflict_rounds
    - onto
    - previous
    - commit
    - failing
    - stop
- id: result
  depends_on:
  - not-started
  - finish
  trigger_rule: one_success
  bash: |
    started=$not-started.output
    finished=$finish.output
    devkit sync output "$started" "$finished"
