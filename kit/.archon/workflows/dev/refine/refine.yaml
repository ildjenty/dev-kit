name: refine
description: |
  Turn a topic Issue or owner request into decision records, binding changes and Issue drafts.
  Review at most three drafts and commit one proposal per version.
  Restart with approve=<version> to agree decisions, publish the PR and create Issues without AI.
worktree:
  enabled: true
inputs:
  topic:
    default: ""
    description: An open Issue number with the configured topic label; empty for the first request.
  owner_words:
    default: ""
    description: The owner's words, verbatim; empty when only answering.
  supplement:
    default: ""
    description: Session research and candidates, kept separate from owner authority.
  memo:
    default: ""
    description: The discussion memo confirmed by the owner.
  answers:
    default: ""
    description: 'Owner answers as a JSON array of {"question_id":"Q1","answer":"..."}.'
  approve:
    default: ""
    description: The latest proposal version to agree, or empty.
  continue:
    default: ""
    description: The owner's words authorizing a restart past the configured limit, or empty.
returns: result
nodes:
  - id: start
    bash: devkit refine start
    output_format:
      type: object
      properties:
        stopped: { type: boolean }
        stage: { type: string }
        reason: { type: string }
        details: { type: string }
        remaining: { type: array, items: { type: string } }
        start: { type: string }
        counted: { type: boolean }
        restarts: { type: integer }
      required: [stopped, stage, reason, details, remaining, start, counted, restarts]

  - id: not-started
    depends_on: [start]
    when: "$start.output.stopped == true"
    bash: |
      started=$start.output
      INPUTS_START="$started" devkit refine not-started
    output_format: &result
      type: object
      properties:
        outcome: { type: string, enum: [not_started, pass, question, stop] }
        proposal_version: { type: integer }
        decision_ids: { type: array, items: { type: string } }
        issue_numbers: { type: array, items: { type: integer } }
        pr_number: { type: integer }
        pr_url: { type: string }
        publication: { type: string }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
            required: [id, text]
        reasons: { type: array, items: { type: string } }
      required: [outcome, proposal_version, decision_ids, issue_numbers, pr_number, pr_url, publication, questions, reasons]

  - id: approve
    depends_on: [start]
    when: "$start.output.stopped == false && $INPUTS.approve != ''"
    bash: devkit refine approve
    output_format: *result

  - id: prepare
    depends_on: [start]
    when: "$start.output.stopped == false && $INPUTS.approve == ''"
    bash: devkit refine prepare
    output_format:
      type: object
      properties:
        input: { type: string }
        criteria: { type: string }
      required: [input, criteria]

  - id: decide
    depends_on: [prepare]
    loop_group:
      max_iterations: 3
      on_exhausted: complete
      nodes:
        - id: write-decide
          provider: claude
          command: decide
          output_format:
            type: object
            additionalProperties: false
            properties:
              draft: { type: string }
            required: [draft]

        - id: check-decide
          depends_on: [write-decide]
          bash: devkit refine check
          output_format: {"type": "object", "properties": {"valid": {"type": "boolean"}, "errors": {"type": "array", "items": {"type": "string"}}}, "required": ["valid", "errors"]}

        - id: judge-decide
          depends_on: [check-decide]
          when: "$check-decide.output.valid == true"
          provider: claude
          settingSources: [user]
          command: judge-decide
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format: {"type":"object","additionalProperties":false,"properties":{"criteria":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"aspect":{"type":"string","enum":["coverage","additions","open_points","consistency","sufficiency","wording","bindings","issues"]},"verdict":{"type":"string","enum":["pass","fail","not_assessed"]},"checked":{"type":"string"},"not_checked":{"type":"string"}},"required":["aspect","verdict","checked","not_checked"]}},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"aspect":{"type":"string","enum":["coverage","additions","open_points","consistency","sufficiency","wording","bindings","issues"]},"item":{"type":"string","minLength":1},"blocking":{"type":"boolean"},"needs_decision":{"type":"boolean"},"failure_scenario":{"type":"string","minLength":1},"evidence":{"type":"string","minLength":1},"fix":{"type":"string","minLength":1},"mechanical":{"type":"boolean"}},"required":["aspect","item","blocking","needs_decision","failure_scenario","evidence","fix","mechanical"]}}},"required":["criteria","findings"]}

        - id: round-decide
          depends_on: [check-decide, judge-decide]
          trigger_rule: none_failed_min_one_success
          bash: |
            judgment=$judge-decide.output
            INPUTS_JUDGMENT="$judgment" devkit refine round
          output_format: {"type": "object", "properties": {"round": {"type": "integer"}, "valid": {"type": "boolean"}, "blocking_count": {"type": "integer"}, "not_assessed_count": {"type": "integer"}}, "required": ["round", "valid", "blocking_count", "not_assessed_count"]}
      until_bash: 'v=$round-decide.output.valid; b=$round-decide.output.blocking_count; n=$round-decide.output.not_assessed_count; test "$v" = true && test "$b" = 0 && test "$n" = 0'

  - id: finish
    depends_on: [decide]
    bash: devkit refine finish
    output_format: *result

  - id: result
    depends_on: [not-started, approve, finish]
    trigger_rule: none_failed_min_one_success
    bash: |
      finished=$finish.output
      approved=$approve.output
      skipped=$not-started.output
      printf '%s' "${finished:-${approved:-$skipped}}"
    output_format: *result
